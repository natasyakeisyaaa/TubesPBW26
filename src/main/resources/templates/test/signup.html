<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Test Signup</title>
    </head>
    <body>
        <h1>Sign Up</h1>
        <p th:if="${error}" th:text="${error}" style="color: red;"></p>

        <form th:action="@{/signup}" th:object="${registerForm}" method="post">
            <div>
                <label>Username:</label><br>
                <input type="text" th:field="*{username}">
                <small th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: red;"></small>
            </div><br>
            <div>
                <label>Full Name:</label><br>
                <input type="text" th:field="*{fullName}">
                <small th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color: red;"></small>
            </div><br>
            <div>
                <label>Password:</label><br>
                <input type="password" th:field="*{password}">
                <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></small>
            </div><br>
            <div>
                <label>Confirm Password:</label><br>
                <input type="password" th:field="*{confirmPassword}">
                <small th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: red;"></small>
            </div><br>
            <button type="submit">Daftar</button>
        </form>

        <p><a th:href="@{/login}">Sudah punya akun? Login</a> | <a th:href="@{/}">Home</a></p>
    </body>
</html>
