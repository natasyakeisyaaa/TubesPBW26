<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Test User Dashboard</title>
    </head>
    <body>
        <h1>User Dashboard</h1>
        <p>Login sebagai: <b th:text="${session.user.fullName}"></b> (@<span th:text="${session.user.username}"></span>) - Role: <b th:text="${session.user.role}"></b></p>

        <p>
            <a th:href="@{/user/gallery}">Galeri Saya</a> |
            <a th:href="@{/user/upload}">+ Upload Memori</a> |
            <a th:href="@{/}">Home</a> |
            <a th:href="@{/login}">Coba /login (Harusnya balik kesini)</a> |
            <a th:href="@{/admin/dashboard}">Coba /admin/dashboard (Harusnya ketendang)</a>
        </p>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>

        <hr>

        <form th:action="@{/user/dashboard}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Cari deskripsi...">
            <div>
                <label>Filter Tag (AND):</label><br>
                <span th:each="tag : ${tags}">
                    <label>
                        <input type="checkbox" name="tagIds" th:value="${tag.id}" th:checked="${#lists.contains(selectedTagIds, tag.id)}">
                        <span th:text="${tag.name}"></span>
                    </label>
                </span>
            </div>
            <button type="submit">Filter</button>
            <a th:href="@{/user/dashboard}">Reset</a>
        </form>

        <hr>
        <p>Total: <b th:text="${gallery.totalItems()}">0</b> gambar (Halaman <span th:text="${gallery.page()}">1</span> dari <span th:text="${gallery.totalPages()}">1</span>)</p>

        <p th:if="${#lists.isEmpty(gallery.items())}">Belum ada gambar.</p>

        <div th:each="img : ${gallery.items()}">
            <img th:src="@{/user/uploads/{file}(file=${img.imagePath})}" width="220" alt="memori">
            <p th:text="${img.description}"></p>
            <p>Oleh: <b th:text="${img.fullName}"></b> (@<span th:text="${img.username}"></span>)</p>
            <p>
                Tags:
                <span th:each="t : ${img.tags}" th:text="'#' + ${t.name} + ' '"></span>
            </p>
            <details>
                <summary>Detail</summary>
                <p>Waktu Upload: <span th:text="${img.uploadedAt}"></span></p>
                <img th:src="@{/user/uploads/{file}(file=${img.imagePath})}" width="400" alt="detail">
            </details>
            <hr>
        </div>

        <p th:if="${gallery.totalPages() > 1}">
            <a th:if="${gallery.hasPrevious()}"
               th:href="@{/user/dashboard(keyword=${#strings.isEmpty(keyword) ? null : keyword}, tagIds=${#lists.isEmpty(selectedTagIds) ? null : selectedTagIds}, page=${gallery.page() - 1})}">Prev</a>
            <span th:text="'Page ' + ${gallery.page()} + ' / ' + ${gallery.totalPages()}"></span>
            <a th:if="${gallery.hasNext()}"
               th:href="@{/user/dashboard(keyword=${#strings.isEmpty(keyword) ? null : keyword}, tagIds=${#lists.isEmpty(selectedTagIds) ? null : selectedTagIds}, page=${gallery.page() + 1})}">Next</a>
        </p>
    </body>
</html>
