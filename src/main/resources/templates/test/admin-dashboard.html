<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Test Admin Dashboard</title>
    </head>
    <body>
        <h1>Admin Dashboard</h1>
        <p>Login sebagai Admin: <b th:text="${session.user.fullName}"></b> (@<span th:text="${session.user.username}"></span>) - Role: <b th:text="${session.user.role}"></b></p>
        <p>
            <a th:href="@{/}">Home</a> |
            <a th:href="@{/login}">Coba buka /login (harusnya redirect ke admin)</a> |
            <a th:href="@{/signup}">Coba buka /signup (harusnya redirect ke admin juga)</a> |
            <a th:href="@{/user/dashboard}">Buka User Dashboard</a>
        </p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </body>
</html>
