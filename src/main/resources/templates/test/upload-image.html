<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Test Upload Image</title>
    </head>
    <body>
        <h1>Upload Memori</h1>
        <p>
            <a th:href="@{/user/dashboard}">Balik ke Dashboard (Dashboard)</a> |
            <a th:href="@{/user/gallery}">Galeri Saya</a>
        </p>

        <p th:if="${error}" th:text="${error}" style="color: red;"></p>

        <form th:action="@{/user/upload}" th:object="${uploadForm}" method="post" enctype="multipart/form-data">
            <div>
                <label>File Gambar (PNG/JPG/JPEG/WEBP, max 10MB):</label><br>
                <input type="file" th:field="*{file}" accept=".png,.jpg,.jpeg,.webp">
                <br><small th:if="${#fields.hasErrors('file')}" th:errors="*{file}" style="color: red;"></small>
            </div><br>

            <div>
                <label>Deskripsi (max 120 karakter):</label><br>
                <textarea th:field="*{description}" rows="3" cols="40" maxlength="120"></textarea>
                <br><small th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: red;"></small>
            </div><br>

            <div>
                <label>Pilih Tag (1–3 tag):</label><br>
                <span th:each="tag : ${tags}">
                    <label>
                        <input type="checkbox" th:field="*{tagIds}" th:value="${tag.id}">
                        <span th:text="${tag.name}"></span>
                    </label><br>
                </span>
                <small th:if="${#fields.hasErrors('tagIds')}" th:errors="*{tagIds}" style="color: red;"></small>
            </div><br>

            <button type="submit">Upload</button>
        </form>
    </body>
</html>
