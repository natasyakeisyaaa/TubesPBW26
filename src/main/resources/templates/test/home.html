<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Test Home</title>
    </head>
    <body>
        <h1>Home</h1>
        <div th:if="${session.user == null}">
            <p>Status: Guest (Belum Login)</p>
            <a th:href="@{/login}">Login</a> |
            <a th:href="@{/signup}">Sign Up</a> |
            <a th:href="@{/user/dashboard}">Coba ke User Dashboard (harusnya redirect ke login)</a>
        </div>
        <div th:if="${session.user != null}">
            <p>Halo, <b th:text="${session.user.fullName}"></b> (@<span th:text="${session.user.username}"></span>) - Role: <b th:text="${session.user.role}"></b></p>
            <a th:href="@{/user/dashboard}">User Dashboard</a> |
            <a th:href="@{/admin/dashboard}">Admin Dashboard</a>
            <form th:action="@{/logout}" method="post" style="margin-top: 10px;">
                <button type="submit">Logout</button>
            </form>
        </div>
    </body>
</html>
