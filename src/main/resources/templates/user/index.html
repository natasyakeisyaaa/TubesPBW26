<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Dashboard</title>
        <style>
            @font-face {
                font-family: 'Inter';
                src: url('/assets/inter/Inter.ttc');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('/assets/inter/InterVariable.ttf');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('/assets/inter/InterVariable-Italic.ttf');
                font-style: normal;
            }
            body {
                margin: 0;
                background-color: #FAF8F6;
                font-family: 'Inter', sans-serif;
                
                main {
                    div.greetings {
                        background-color: #F5E9E7;
                        margin: 15px;
                        padding: 10px 15px;
                        border-radius: 10px;
                        p {
                            color: #71756F;
                        }
                    }
                    div.search {
                        margin: 15px;
                        h2 {
                            margin-bottom: 0;
                        }
                        p {
                            margin-top: 0;
                            color: #71756F;
                        }
                        form {
                            margin-top: 10px;
                            select, input {
                                border: 0;
                                border-radius: 5px;
                                padding: 10px;
                            }
                            select {
                                color: #71756F;
                                width: 20%;
                                margin-right: 5%;
                            }
                            input[name="input-search-deskripsi"] {
                                color: #71756F;
                                width: 60%;
                            }
                            input[name="input-terapkan"] {
                                background-color:#71756F;
                                color: white;
                            }
                            input[name="input-reset"] {
                                color: #71756F;
                                background-color: #FAF8F6;
                            }
                        }
                        span span span{
                            background-color: #71756F;
                            color: white;
                            padding: 2px 5px;
                            border-radius: 15px;
                        }
                    }
                    .card-grid {
                        margin: 15px;
                        display: grid;
                        grid-template-columns: repeat(3, 1fr);
                        gap: 15px;
                        .card-content {
                            background-color: white;
                            min-width: 0;
                            border-radius: 10px;
                            img {
                                width: 100%;
                                height:200px;
                                border-radius: 10px 10px 0 0;
                            }
                            #card-text {
                                margin: 10px;
                                display: flex;
                                flex-direction: column;
                                gap: 10px;
                            }
                            span:nth-of-type(2), span span{
                                color: #71756F;
                            }
                            span span {
                                border-radius: 20px;
                                background-color: #F5E9E7;
                                padding: 0 5px;
                            }
                            #card-row3 {
                                display: flex;
                                justify-content: space-between;
                            }
                        }
                    }
                    div.empty-memori {
                        display: flex;
                        justify-content: center;
                        p {
                            color: #71756F;
                            font-style: italic;
                        }
                    }
                }
            }
        </style>
    </head>
    <body>
        <div th:replace="~{/../fragment/navbar :: navbar('jelajahi')}"></div>
        <main>
            <div class="greetings">
                <h1 th:text="|Halo, ${username}!|">Halo, Wombats!</h1>
                <p>Rekam momen indahmu dan bagikan pada seluruh dunia</p>
            </div>
            <!-- cocokin th nya -->
            <div class="search">
                <h2>Jelajahi Memori</h2>
                <p th:text="|${memories.num} memori dari komunitas|">sekian memori dari komunitas</p>
                <span th:if="${!#strings.isEmpty(tag)}">
                    <span th:each="tag : ${daftarTag}">
                        <span th:text="${tag}">
                            tags
                            <a id="delete-tags">x</a>
                        </span>
                    </span>
                </span>
                <form th:action = "@{/input/search}">
                    <input name="input-search-deskripsi" type="text" placeholder="Cari berdasarkan deskripsi memori...">
                    <select name="input-search-tag">
                        <option value="">Pilih tag memori yang ingin dicari</option>
                        <option th:each="tag : ${daftarSemuaTag}" th:value="${tag}" th:text="${tag}"></option>
                    </select>
                    <input name="input-terapkan" type="submit" value="Terapkan">
                    <input name="input-reset" type="submit" value="Reset">
                </form>
            </div>
            <div th:if="${#lists.isEmpty(daftarMemori)}" class="empty-memori">
                <p>Belum ada memori yang diunggah</p>
            </div>
            <div th:unless="${#lists.isEmpty(daftarMemori)}" class="card-grid">
                <div class="card-content" th:each="content : ${daftarMemori}">
                    <img src="../../static/assets/content/placeholder.png" th:src="${!#strings.isEmpty(content.image)} ? @{|/assets/content/${content.image}|} : @{/assets/content/placeholder.png}" alt="memori">
                    <div id="card-text">
                        <span th:text="${content.description}">Deskripsi</span>                    
                        <span th:text="|${content.name}  -  ${content.date}|">netizen date</span> 
                        <span id="card-row3">
                            <span id="tags" th:each="tag : ${content.daftarTag}">
                                <span th:text="|#${tag}|">
                                    tags
                                </span>
                            </span>
                            <a th:href="@{/profil/{user}(user=${content.username})}">Lihat profil</a>
                        </span>
                    </div>
                </div>
            </div>
        </main>
            <div th:insert="~{/../fragment/pagination :: pagination}"></div>
    </body>
</html>
