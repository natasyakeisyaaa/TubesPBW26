<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="../../static/styles.css">
    </head>
    <body>
        <div th:replace="~{/../fragment/navbar :: navbar('jelajahi')}"></div>
        <main>
            <div class="greetings">
                <h1 th:text="|Halo, ${username}!|">Halo, Wombats!</h1>
                <p>Rekam momen indahmu dan bagikan pada seluruh dunia</p>
            </div>
            <!-- cocokin th nya -->
            <div class="search">
                <h2>Jelajahi Memori</h2>
                <p th:text="|${memories.num} memori dari komunitas|">sekian memori dari komunitas</p>
                <span th:if="${!#strings.isEmpty(tag)}">
                    <span th:each="tag : ${daftarTag}">
                        <span th:text="${tag}">
                            tags
                            <a id="delete-tags">x</a>
                        </span>
                    </span>
                </span>
                <form th:action = "@{/input/search}">
                    <input name="input-search-deskripsi" type="text" placeholder="Cari berdasarkan deskripsi memori...">
                    <select name="input-search-tag">
                        <option value="">Pilih tag memori yang ingin dicari</option>
                        <option th:each="tag : ${daftarSemuaTag}" th:value="${tag}" th:text="${tag}"></option>
                    </select>
                    <input name="input-terapkan" type="submit" value="Terapkan">
                    <input name="input-reset" type="submit" value="Reset">
                </form>
            </div>
            <div th:if="${#lists.isEmpty(daftarMemori)}" class="empty-memori">
                <p>Belum ada memori yang diunggah</p>
            </div>
            <div th:unless="${#lists.isEmpty(daftarMemori)}" class="card-grid">
                <div class="card-content" th:each="content : ${daftarMemori}">
                    <img src="../../static/assets/content/placeholder.png" th:src="${!#strings.isEmpty(content.image)} ? @{|/assets/content/${content.image}|} : @{/assets/content/placeholder.png}" alt="memori">
                    <div id="card-text">
                        <span th:text="${content.description}">Deskripsi</span>                    
                        <span th:text="|${content.name}  -  ${content.date}|">netizen date</span> 
                        <span id="card-row3">
                            <span id="tags" th:each="tag : ${content.daftarTag}">
                                <span th:text="|#${tag}|">
                                    tags
                                </span>
                            </span>
                            <a th:href="@{/profil/{user}(user=${content.username})}">Lihat profil</a>
                        </span>
                    </div>
                </div>
            </div>
        </main>
            <div th:insert="~{/../fragment/pagination :: pagination}"></div>
    </body>
</html>
