<style>
    #pagination {
        display: flex;
        justify-content: space-between;
        span {
            color: #71756F;
        }
    }
    ul.pagination-container {
        a.disabled {
            pointer-events: none;
            color: gray;
            cursor: not-allowed;
        }
        #sebelumnya-btn {
            background-color: white;
            padding: 5px;
            border-radius: 5px;
        }
        #page-btn {
            background-color: #F0F0EB;
            border-radius: 50px;
            a.active {
                background-color: #71756F;
                color: white;
            }
        }
        #berikutnya-btn {
            color: #71756F;
        }
    }
</style>
<div id="pagination" th:fragment="pagination">
    <span id="memories-num" th:text="|Menampilkan ${currentPage * 6 - 5} - ${currentPage * 6} dari ${totalMemories} memori"></span>
    <nav th:if="${pageCount > 1}">
        <ul class="pagination-container">
            <li id="sebelumnya-btn">
                <a th:href="@{/dashboard/(page=${currentPage} - 1, filter=${description})}" aria-label="Sebelumnya" th:class="${currentPage}==1 ? 'disabled' : null">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li id="page-btn" th:each="i : ${#numbers.sequence(currentPage-1, currentPage+1)}">
                <a th:href="@{/dashboard/(page=${i}, filter=${filter})}" th:text="${i}" th:class="${currentPage}==${i} ? 'active' : null"></a>
            </li>

            <li id="selanjutnya-btn">
                <a th:href="@{/dashboard/(page=${currentPage} + 1, filter=${filter})}" aria-label="Selanjutnya" th:class="${currentPage}==${pageCount} ? 'disabled' : null">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>
</div>
