<!DOCTYPE html>
<html>
    <head>
        <title>Homepage Memorie</title>
        <style>
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/Inter.ttc');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/InterVariable.ttc');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/InterVariable-Italic.ttc');
                font-style: normal;
            }
            body {
                margin: 0;
                background-color: #FAF8F6;
                font-family: 'Inter', sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                .auth {
                    margin-right: 15px;
                    margin-top: 15px;
                    display: flex;
                    gap: 10px;
                    a {
                        padding: 5px;
                        border-radius: 5px;
                    }
                    a:nth-of-type(1) {
                        background-color: #71756F;
                        color: white;
                    }
                    a:nth-of-type(2) {
                        background-color:  #F5E9E7;
                    }
                }
                .logo {
                color: black;
                font-weight: bold;
                font-size: 75px;
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 7px;
                img {
                    width: 50px;
                    height: 50px;
                }
            }
            }
        </style>
    </head>
    <body>
        <div class="auth">
            <a th:href="{@/signup}">Sign Up</a>
            <a th:href="{@/login}">Login</a>
        </div>
        <div class="logo">
            <img alt="logo" src="../../static/assets/logo.png">
            <p>memorie</p>
        </div>        
        <div class="about">
            <p>Buat memori sebanyak mungkin, simpan, dan bagikan pada seluruh dunia.</p>
        </div>
    </body>
</html>
