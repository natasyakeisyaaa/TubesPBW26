<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <style>
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/Inter.ttc');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/InterVariable.ttc');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/InterVariable-Italic.ttc');
                font-style: normal;
            }
            body {
                margin: 0;
                background-color: #FAF8F6;
                font-family: 'Inter', sans-serif;
                header {
                    background-color: white;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 5px 15px;
                    font-size: 10px;
                    a {
                        text-decoration: none;
                    }
                    .logo {
                        color: black;
                        font-weight: bold;
                        font-size: 15px;
                        display: flex;
                        flex-direction: row;
                        align-items: center;
                        gap: 7px;
                        img {
                            width: 20px;
                            height: 20px;
                        }
                    }
                    .header-action {
                        a {
                            color:#71756F
                        }
                        a#jelajahi {
                            background-color: #F5E9E7;
                            padding: 5px;
                            border-radius: 5px;
                        }

                    }
                    .unggah-memori {
                        background-color: #71756F;
                        padding: 5px;
                        border-radius: 5px;
                        a {
                           color: white;
                        }
                    }
                }

                main {
                    div.greetings {
                        background-color: #F5E9E7;
                        margin: 15px;
                        padding: 10px 15px;
                        border-radius: 10px;
                        p {
                            color: #71756F;
                        }
                    }
                    div.search {
                        margin: 15px;
                        h2 {
                            margin-bottom: 0;
                        }
                        p {
                            margin-top: 0;
                            color: #71756F;
                        }
                        form {
                            input {
                                border: 0;
                                border-radius: 5px;
                                padding: 10px;
                            }
                            input[name="input-terapkan"] {
                                background-color:#71756F;
                                color: white;
                            }
                            input[name="input-reset"] {
                                color: #71756F;
                                background-color: #FAF8F6;
                            }
                        }
                    }
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">
                <img alt="logo" src="../assets/logo.png">
                <p>memorie</p>
            </div>
            <div class="header-action">
                <a id="jelajahi" href="index.html">Jelajahi</a>
                <a id="galeri-saya" href="galeri_saya.html">Galeri saya</a>
            </div>
            <div class="unggah-memori">
                <a id="tambah_memori" href="tambah_memori.html">+ Unggah Memori</a>
            </div>
        </header>
        <main>
            <div class="greetings">
                <h1 th:text="Halo, ${username}!">Halo, Wombats!</h1>
                <p>Rekam momen indahmu dan bagikan pada seluruh dunia</p>
            </div>
            <!-- belom beres -->
            <div class="search">
                <h2>Jelajahi Memori</h2>
                <p th:text="${memories.num} memori dari komunitas">sekian memori dari komunitas</p>
                <div class="search-bar">
                    <span class="badge-tag-aktif" 
                </div>
                <form>
                    <input name="input-search" type="text" value="Cari berdasarkan deskripsi dan tag memori...">
                    <input name="input-terapkan" type="submit" value="Terapkan">
                    <input name="input-reset" type="submit" value="Reset">
                </form>
            </div>
        </main>
    </body>
</html>
