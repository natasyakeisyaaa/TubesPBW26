<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard</title>
        <style>
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/Inter.ttc');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/InterVariable.ttc');
                font-style: normal;
            }
            @font-face {
                font-family: 'Inter';
                src: url('assets/inter/InterVariable-Italic.ttc');
                font-style: normal;
            }
            body {
                margin: 0;
                background-color: #F0F0EB;
                font-family: 'Inter', sans-serif;
                header {
                    background-color: white;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 5px 15px;
                    font-size: 10px;
                    a {
                        text-decoration: none;
                    }
                    .logo {
                        color: black;
                        font-weight: bold;
                        font-size: 15px;
                        display: flex;
                        flex-direction: row;
                        align-items: center;
                        gap: 7px;
                        img {
                            width: 20px;
                            height: 20px;
                        }
                    }
                    .header-action {
                        a {
                            color:#71756F
                        }
                        a#jelajahi {
                            background-color: #F5E9E7;
                            padding: 5px;
                            border-radius: 5px;
                        }

                    }
                    .unggah-memori {
                        background-color: #71756F;
                        padding: 5px;
                        border-radius: 5px;
                        a {
                           color: white;
                        }
                    }
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">
                <img alt="logo" src="../assets/logo.png">
                <p>memorie</p>
            </div>
            <div class="header-action">
                <a id="jelajahi" href="index.html">Jelajahi</a>
                <a id="galeri-saya" href="galeri_saya.html">Galeri saya</a>
            </div>
            <div class="unggah-memori">
                <a id="tambah_memori" href="tambah_memori.html">+ Unggah Memori</a>
            </div>
        </header>
    </body>
</html>
